# Quant-Agent-OS team server (B-19). See docs/deployment.md.
#
#   docker compose -f deploy/compose.yaml build
#   CORPUS=/path/to/notes docker compose -f deploy/compose.yaml run --rm ingest
#   docker compose -f deploy/compose.yaml run --rm keys new --principal alice \
#       --scope tools:list --scope tools:call
#   DATASETS_SOURCE=/path/to/csvs docker compose -f deploy/compose.yaml run --rm datasets \
#       add /import/returns.csv --id returns
#   docker compose -f deploy/compose.yaml up -d server
#
# The server answers MCP at /mcp and REST at /v1 (decision 0012).
#
# The server reaches the knowledge store, datasets, and keys read-only. Only the run store is
# writable.

x-image: &image
  image: ${QAOS_IMAGE:-quant-agent-os:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

services:
  server:
    <<: *image
    restart: unless-stopped
    # Permissions stay read-only unless QUANT_AGENT_OS_GRANTED_PERMISSIONS is set here
    # (docs/security.md).
    ports:
      # Loopback only. Put a TLS-terminating reverse proxy in front before exposing it.
      - "127.0.0.1:${QAOS_PORT:-8000}:8000"
    volumes:
      - knowledge:/data/knowledge:ro
      - keys:/keys:ro
      - datasets:/data/datasets:ro
      - runs:/data/runs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Operator commands: run them with `docker compose run --rm <name> ...`.
  ingest:
    <<: *image
    profiles: [operator]
    entrypoint: ["qaos", "ingest"]
    command: ["/corpus", "--store", "/data/knowledge/kb.db"]
    volumes:
      - ${CORPUS:-../src/quant_platform/sample/corpus}:/corpus:ro
      - knowledge:/data/knowledge
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  datasets:
    <<: *image
    profiles: [operator]
    entrypoint: ["qaos", "data"]
    command: ["--help"]
    volumes:
      - datasets:/data/datasets
      - ${DATASETS_SOURCE:-../src/quant_platform/sample/datasets}:/import:ro
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  keys:
    <<: *image
    profiles: [operator]
    entrypoint: ["qaos", "keys"]
    command: ["--help"]
    volumes:
      - keys:/keys
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  runs:
    <<: *image
    profiles: [operator]
    entrypoint: ["qaos", "runs", "--runs", "/data/runs/runs.db"]
    command: []
    volumes:
      - runs:/data/runs  # writable: SQLite shares the file with the running server
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Checks what the deployed server would open, changes nothing, and prints no secrets, so its
  # output can go in a support ticket. It sees only the settings given here: set a wider
  # QUANT_AGENT_OS_GRANTED_PERMISSIONS or an access file on it as you do on the server.
  doctor:
    <<: *image
    profiles: [operator]
    entrypoint: ["qaos", "doctor"]
    command: []
    environment:
      QUANT_AGENT_OS_HOME: /data
      QUANT_AGENT_OS_STORE: /data/knowledge/kb.db
      QUANT_AGENT_OS_RUNS_FILE: /data/runs/runs.db
    volumes:
      - knowledge:/data/knowledge:ro
      - datasets:/data/datasets:ro
      - keys:/keys:ro
      - runs:/data/runs  # writable: SQLite shares the file with the running server
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Writes a tar of the volumes to stdout, or of the ones named: `run --rm -T backup data/runs`.
  # Stop the server first, so the SQLite files are at rest (docs/operations.md).
  backup:
    <<: *image
    profiles: [operator]
    entrypoint: ["tar", "-C", "/", "-cf", "-"]
    command: ["data/knowledge", "data/datasets", "data/runs", "keys"]
    volumes:
      - knowledge:/data/knowledge:ro
      - datasets:/data/datasets:ro
      - keys:/keys:ro
      - runs:/data/runs:ro
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Reads a backup from stdin and replaces the volumes it holds: `run --rm -T restore < file`.
  # It checks the whole archive before it deletes anything. Stop the server first.
  restore:
    <<: *image
    profiles: [operator]
    entrypoint:
      - sh
      - -ec
      - |
        cat >/tmp/restore.tar
        tar -tf /tmp/restore.tar >/tmp/members
        grep -qE '^(data/(knowledge|datasets|runs)|keys)/' /tmp/members || {
          echo "error: this is not an archive from the backup service. Nothing was changed." >&2
          exit 1
        }
        for dir in data/knowledge data/datasets data/runs keys; do
          if grep -q "^$$dir/" /tmp/members; then find "/$$dir" -mindepth 1 -delete; fi
        done
        tar -C / -xf /tmp/restore.tar
    command: []
    volumes:
      - knowledge:/data/knowledge
      - datasets:/data/datasets
      - keys:/keys
      - runs:/data/runs
    network_mode: none
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  knowledge:
  datasets:
  keys:
  runs:
