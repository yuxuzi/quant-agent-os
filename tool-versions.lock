    "plan_app": {
      "input_schema": {
        "$defs": {
          "AppSpec": {
            "description": "What to build. A model may draft it later (B-16); a person always reviews it.\n\nChoose what to build with ``kind`` (a shortcut), or with ``template`` and ``profile``:\n``template`` is a built-in pack (``agent-tool``, ``quant-baseline``), ``bundled`` for\npytemplate-uv's own profiles, a name registered in factory.toml, or the path of your own\npack. ``answers`` hold the\ntemplate's other questions, such as ``frequency`` or ``cost_bps``.\n\n``output_dir`` is the existing parent directory of the new project, as an absolute path;\n`load_spec` resolves a relative ``output_dir`` or ``template`` path against the spec file.",
            "properties": {
              "answers": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Other template answers",
                "title": "Answers",
                "type": "object"
