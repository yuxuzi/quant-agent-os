                "type": "string"
              },
              "email": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "Default: factory settings, git",
                "title": "Email"
              },
              "kind": {
                "anyOf": [
                  {
                    "enum": [
                      "agent-tool",
                      "python-cli",
                      "fastapi-service",
                      "quant-research",
                      "alpha-research",
                      "backtest",
                      "report"
                    ],
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Kind"
              },
              "license": {
                "anyOf": [
                  {
                    "pattern": "^[A-Za-z0-9.+-]+( (AND|OR|WITH) [A-Za-z0-9.+-]+)*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "License"
              },
              "name": {
                "description": "Project slug",
                "pattern": "^[a-z][a-z0-9]*(-[a-z0-9]+)*$",
                "title": "Name",
                "type": "string"
              },
              "output_dir": {
                "description": "Existing parent directory (absolute)",
                "title": "Output Dir",
                "type": "string"
              },
              "profile": {
                "anyOf": [
                  {
                    "pattern": "^[a-z][a-z0-9-]*$",
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "title": "Profile"
              },
              "python_version": {
                "default": "3.11",
                "enum": [
                  "3.11",
                  "3.12",
                  "3.13",
                  "3.14",
                  "3.15"
                ],
                "title": "Python Version",
                "type": "string"
              },
              "quant_agent_os_source": {
                "default": "git+https://github.com/yuxuzi/quant-agent-os",
                "description": "agent-tool only: a git+https URL or a local path to quant-agent-os",
                "title": "Quant Agent Os Source",
                "type": "string"
              },
              "settings": {
                "additionalProperties": {
                  "type": "string"
                },
                "description": "Runtime settings (environment variables the app reads): a value or env:NAME",
                "title": "Settings",
                "type": "object"
              },
              "template": {
                "anyOf": [
                  {
                    "type": "string"
                  },
                  {
                    "type": "null"
                  }
                ],
                "default": null,
                "description": "agent-tool, quant-baseline, bundled, or a pack directory",
                "title": "Template"
              },
              "tool_name": {
