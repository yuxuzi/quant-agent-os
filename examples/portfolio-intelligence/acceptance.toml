# Agreed test cases for the fictional firm: qaos eval --gold examples/portfolio-intelligence/acceptance.toml
# The numbers come from a separate numpy calculation over data/, not from the tools under test, and
# tests/integration/test_acceptance.py repeats that calculation.

[[numeric]]
name = "growth book volatility"
tool = "analyze_performance"
arguments = { returns = { dataset = "growth-book", column = "book" } }
value = "metrics.annualized_volatility"
expected = 0.17029039110268307
tolerance = 1e-9

