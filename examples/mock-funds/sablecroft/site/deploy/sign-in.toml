# Sablecroft's sign-in file for the platform (decision 0028), as the platform's docs describe it.
# Entra ID cannot answer this: it has no introspection endpoint. The fund runs the shim of
# site/sablecroft_entra.py beside the server and points introspection_url at it (loopback http is allowed).
resource = "https://qaos.sablecroft.example/mcp"   # also the Entra application ID URI of the API

[[authorization_servers]]
issuer = "https://login.microsoftonline.com/b1d0c2de-7a61-4f9e-a3b2-5c0d9e8f1a22/v2.0"
introspection_url = "http://127.0.0.1:8081/introspect"
client_id = "qaos"
client_secret_env = "QAOS_INTROSPECTION_SECRET"     # a Key Vault secret surfaced as an env var
tenant_claim = ""                                    # Entra sends no firm claim; issuer + audience bind
groups_claim = "groups"                              # the claim holds security-group GUIDs
