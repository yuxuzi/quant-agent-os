# Wrenfield Credit Opportunities (fictional): sign-in through Amazon Cognito (decisions 0028 and 0031).
# The pool's signed access tokens are checked against its published keys, so there is no introspection
# shim, no sidecar, and no client secret. Machine tokens (client credentials) have no username: their
# principal is their sub, the app client's id.
resource = "https://qaos.wrenfield.example.com/mcp"

[[authorization_servers]]
issuer = "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_WrnFld001"
verify = "jwks"
client_ids = ["wf-cli", "wf-batch"]          # the app clients; these tokens have no aud
token_use = "access"
tenant_claim = ""                            # the pool sends no tenant claim: one tenant, local
groups_claims = ["cognito:groups"]
principal_claim = "username"                 # audit rows name pm-hy, not a UUID
scope_claims = ["scope"]

[authorization_servers.scope_map]
"qaos/tools.list" = "tools:list"
"qaos/tools.call" = "tools:call"
