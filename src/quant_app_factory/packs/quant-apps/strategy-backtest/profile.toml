contract = 1
id = "strategy-backtest"
name = "Strategy backtest"
description = "From signals or target weights to net returns: lagged trades, drift, rebalancing, costs, delistings, and walk-forward. Bring your own portfolio rule; export returns for the report."
version = "1"
kind = "cli"
status = "experimental"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
default_components = []
optional_components = ["agent-tools"]
dependencies = ["numpy>=1.26", "typer>=0.12"]
questions = ["description", "author", "email", "python_version", "license", "frequency", "cost_bps"]
security_posture = "Reads local price and signal files only; a simulation with no orders, broker connectivity, or credentials in the project."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
