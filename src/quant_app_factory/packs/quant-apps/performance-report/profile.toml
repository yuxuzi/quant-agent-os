contract = 1
id = "performance-report"
name = "Performance report"
description = "From returns to the firm's own tear sheets: returns by horizon, return tables, risk basics, charts, and a reconciliation against reference figures. Choose the sections; add your own."
version = "1"
kind = "cli"
status = "experimental"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
default_components = []
optional_components = ["agent-tools"]
dependencies = ["numpy>=1.26", "openpyxl>=3.1", "typer>=0.12"]
questions = ["description", "author", "email", "python_version", "license", "frequency"]
security_posture = "Reads local return files only; no orders, broker connectivity, or credentials in the project."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
