# Questions for the quant-baseline pack. Add questions rather than renaming or removing them,
# so `pytemplate update` can replay recorded answers.
_min_copier_version: "9.4"
_templates_suffix: .jinja

profile:
  type: str
  help: Project profile
  choices:
    - quant-research

project_name:
  type: str
  help: Lowercase project slug
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Use a lowercase slug beginning with a letter.
    {% endif %}

package_name:
  type: str
  help: Importable Python package name
  default: "{{ project_name | lower | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use a lowercase Python identifier.
    {% endif %}

description:
  type: str
  help: One-line project description
  default: A quant research project
  validator: >-
    {% if '"' in description or '\\' in description or '\n' in description or not description.strip() %}
    Use non-empty text on one line without double quotes or backslashes.
    {% endif %}

author:
  type: str
  help: Author name
  default: Your Name
  validator: >-
    {% if '"' in author or '\\' in author or '\n' in author or not author.strip() %}
    Use non-empty text on one line without double quotes or backslashes.
    {% endif %}

email:
  type: str
  help: Author email
  default: your@email.com
  validator: >-
    {% if '"' in email or '\\' in email or '\n' in email or not email.strip() %}
    Use non-empty text on one line without double quotes or backslashes.
    {% endif %}

python_version:
  type: str
  help: Minimum supported Python version
  default: "3.11"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.15"

license:
  type: str
  help: SPDX license expression, for example MIT or Apache-2.0
  default: MIT
  validator: >-
    {% if not (license | regex_search('^[A-Za-z0-9.+-]+( (AND|OR|WITH) [A-Za-z0-9.+-]+)*$')) %}
    Use an SPDX license expression such as MIT or Apache-2.0.
    {% endif %}

frequency:
  type: str
  help: Bar frequency of the price data (sets the annualisation factor)
  default: daily
  choices:
    - daily
    - weekly
    - monthly

max_horizon:
  type: str
  help: Longest forward horizon, in bars, for information-coefficient decay
  default: "5"
  validator: >-
    {% if not (max_horizon | regex_search('^[1-9][0-9]?$')) %}
    Use a whole number of bars from 1 to 99.
    {% endif %}

cost_bps:
  type: str
  help: Transaction cost per unit of one-way turnover, in basis points
  default: "5"
  validator: >-
    {% if not (cost_bps | regex_search('^[0-9]+(\\.[0-9]+)?$')) %}
    Use a non-negative number of basis points, such as 5 or 2.5.
    {% endif %}

quant_agent_os_source:
  type: str
  help: Where to install quant-agent-os from (agent-tools only), a git+https URL or a local path
  default: git+https://github.com/yuxuzi/quant-agent-os
  when: "{{ 'agent-tools' in components }}"
  validator: >-
    {% if '"' in quant_agent_os_source or '\\' in quant_agent_os_source or not quant_agent_os_source.strip() %}
    Use a git+https URL or a path written with forward slashes.
    {% endif %}

db_kind:
  type: str
  help: Database kind
  default: sqlite
  choices:
    - postgres
    - sqlite
    - duckdb
  when: "{{ 'data-database' in components }}"

db_host:
  type: str
  help: Database host (postgres)
  default: localhost
  when: "{{ 'data-database' in components and db_kind == 'postgres' }}"
  validator: >-
    {% if not (db_host | regex_search('^[A-Za-z0-9.-]+$')) %}
    Use a host name or address.
    {% endif %}

db_port:
  type: str
  help: Database port (postgres)
  default: "5432"
  when: "{{ 'data-database' in components and db_kind == 'postgres' }}"
  validator: >-
    {% if not (db_port | regex_search('^[0-9]{1,5}$')) %}
    Use a port number.
    {% endif %}

db_name:
  type: str
  help: Database name (postgres), or the database file path (sqlite, duckdb)
  default: prices.db
  when: "{{ 'data-database' in components }}"
  validator: >-
    {% if '"' in db_name or '\\' in db_name or not db_name.strip() %}
    Use a name or a path written with forward slashes.
    {% endif %}

db_user:
  type: str
  help: Database user (postgres)
  default: research
  when: "{{ 'data-database' in components and db_kind == 'postgres' }}"
  validator: >-
    {% if not (db_user | regex_search('^[A-Za-z0-9_.-]+$')) %}
    Use a user name of letters, digits, dots, dashes, or underscores.
    {% endif %}

db_schema:
  type: str
  help: Schema to search first (blank for the default)
  default: ""
  when: "{{ 'data-database' in components and db_kind == 'postgres' }}"
  validator: >-
    {% if db_schema and not (db_schema | regex_search('^[A-Za-z_][A-Za-z0-9_]*$')) %}
    Use a schema name of letters, digits, and underscores.
    {% endif %}

db_sslmode:
  type: str
  help: TLS for postgres; verify-full checks the server certificate (disable is insecure)
  default: verify-full
  choices:
    - verify-full
    - verify-ca
    - require
    - disable
  when: "{{ 'data-database' in components and db_kind == 'postgres' }}"

db_query:
  type: str
  help: Query returning one row per price, with columns date, asset, price
  default: SELECT date, asset, price FROM prices ORDER BY date, asset
  when: "{{ 'data-database' in components }}"
  validator: >-
    {% if '"' in db_query or '\\' in db_query or '\n' in db_query or not (db_query | regex_search('^\\s*(?i:select|with)\\b')) %}
    Use one line starting with SELECT or WITH, without double quotes or backslashes.
    {% endif %}

db_read_only:
  type: str
  help: Open the database read-only
  default: "yes"
  choices:
    - "yes"
    - "no"
  when: "{{ 'data-database' in components }}"

# Set by pytemplate from the profile defaults plus requested components (passed as data).
components:
  type: str
  help: Components to include
  multiselect: true
  choices:
    - agent-tools
    - data-csv
    - data-database
    - data-parquet
    - metrics
  default: []
