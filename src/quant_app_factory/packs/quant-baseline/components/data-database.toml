contract = 1
id = "data-database"
name = "Database price data"
description = "Load prices from PostgreSQL, SQLite, or DuckDB with one read-only query, plus a check-connection command."
version = "1"
status = "experimental"
compatible_profiles = ["quant-lab"]
dependencies = ["sqlalchemy>=2.0"]
questions = ["db_kind", "db_host", "db_port", "db_name", "db_user", "db_schema", "db_sslmode", "db_query", "db_read_only"]
paths = ["{package}/database.py", ".env.example", "tests/test_database.py"]
security_notes = ["PostgreSQL connections verify the server certificate (sslmode=verify-full) unless the spec chooses a weaker mode.", "Credentials come only from the DATABASE_URL or DATABASE_PASSWORD environment variables; nothing secret is written into the project.", "Connections are read-only by default: SQLite query-only, DuckDB read-only files, PostgreSQL read-only transactions."]

[[settings]]
name = "DATABASE_URL"
type = "str"
description = "Full SQLAlchemy URL; when set, it replaces the host, port, database, and user."
secret = true

[[settings]]
name = "DATABASE_PASSWORD"
type = "str"
description = "Password for the configured user (PostgreSQL)."
secret = true
