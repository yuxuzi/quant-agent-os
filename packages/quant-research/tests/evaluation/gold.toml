# Gold set for the fixture corpus. `related` lists entity ids that a correct answer surfaces;
# `documents` lists the corpus files whose passages are relevant. `expect_empty` marks queries
# the corpus cannot answer, which should return no passages.

[[queries]]
query = "What is related to short-term reversal?"
related = ["signal:order-flow-imbalance", "signal:liquidity-provision", "factor:momentum"]
documents = ["reversal-and-microstructure.md", "notes/order-flow.md", "momentum-crashes.md"]

[[queries]]
query = "what explains the value factor"
related = ["factor:profitability"]
documents = ["notes/value-and-quality.md"]

[[queries]]
query = "PEAD"
related = ["signal:analyst-revisions"]
documents = ["notes/earnings.txt"]

[[queries]]
query = "How does time-series momentum relate to other strategies?"
related = ["factor:momentum", "strategy:trend-following"]
documents = ["momentum-crashes.md"]

[[queries]]
query = "quality minus junk"
related = ["factor:low-volatility"]
documents = ["notes/value-and-quality.md"]

[[queries]]
query = "why do market makers earn the spread"
related = ["signal:liquidity-provision"]
documents = ["reversal-and-microstructure.md"]

[[queries]]
query = "crypto funding rates"
expect_empty = true

[[queries]]
query = "betting against beta"
related = ["factor:quality", "factor:profitability"]
documents = ["papers/low-volatility.pdf", "notes/value-and-quality.md"]

[[queries]]
query = "Which signals work in futures markets?"
related = ["signal:carry", "signal:time-series-momentum"]
documents = ["papers/low-volatility.pdf", "momentum-crashes.md"]

# Paraphrases: no vocabulary term, so only meaning connects them to the answer. They are scored
# separately (paraphrase_hit_rate@3) to show whether an embedding model adds value.

[[queries]]
query = "Do stocks that fell last month tend to bounce back?"
paraphrase = true
documents = ["reversal-and-microstructure.md"]

[[queries]]
query = "Why would investors who cannot use leverage overpay for risky shares?"
paraphrase = true
documents = ["papers/low-volatility.pdf"]

[[queries]]
query = "Which approaches profit from persistent price trends in commodities?"
paraphrase = true
documents = ["momentum-crashes.md", "papers/low-volatility.pdf"]

[[queries]]
query = "Does surprising company news keep moving the share price for weeks?"
paraphrase = true
documents = ["notes/earnings.txt"]
