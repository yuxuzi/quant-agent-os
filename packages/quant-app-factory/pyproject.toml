[project]
name = "quant-agent-os-factory"
version = "0.1.0"
description = "Quant App Factory: generate tested, packaged Python applications with Quant-Agent-OS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["quant-agent-os"]

[tool.uv.sources]
quant-agent-os = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_app_factory"
