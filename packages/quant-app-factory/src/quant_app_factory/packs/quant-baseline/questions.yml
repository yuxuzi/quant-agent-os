# Questions for the quant-baseline profiles. Add questions rather than renaming or removing them,
# so `pytemplate update` can replay recorded answers.
_min_copier_version: "9.4"
_templates_suffix: .jinja

profile:
  type: str
  help: Project profile
  choices:
    - alpha-research
    - backtest
    - report

project_name:
  type: str
  help: Lowercase project slug
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Use a lowercase slug beginning with a letter.
    {% endif %}

package_name:
  type: str
  help: Importable Python package name
  default: "{{ project_name | lower | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use a lowercase Python identifier.
    {% endif %}

description:
  type: str
  help: One-line project description
  default: A quant research project
  validator: >-
    {% if '"' in description or '\\' in description or '\n' in description or not description.strip() %}
    Use non-empty text on one line without double quotes or backslashes.
    {% endif %}

author:
  type: str
  help: Author name
  default: Your Name
  validator: >-
    {% if '"' in author or '\\' in author or '\n' in author or not author.strip() %}
    Use non-empty text on one line without double quotes or backslashes.
    {% endif %}

email:
  type: str
  help: Author email
  default: your@email.com
  validator: >-
    {% if '"' in email or '\\' in email or '\n' in email or not email.strip() %}
    Use non-empty text on one line without double quotes or backslashes.
    {% endif %}

python_version:
  type: str
  help: Minimum supported Python version
  default: "3.11"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
    - "3.15"

license:
  type: str
  help: SPDX license expression, for example MIT or Apache-2.0
  default: MIT
  validator: >-
    {% if not (license | regex_search('^[A-Za-z0-9.+-]+( (AND|OR|WITH) [A-Za-z0-9.+-]+)*$')) %}
    Use an SPDX license expression such as MIT or Apache-2.0.
    {% endif %}

frequency:
  type: str
  help: Bar frequency of the price data (sets the annualisation factor)
  default: daily
  choices:
    - daily
    - weekly
    - monthly

max_horizon:
  type: str
  help: Longest forward horizon, in bars, for information-coefficient decay
  default: "5"
  validator: >-
    {% if not (max_horizon | regex_search('^[1-9][0-9]?$')) %}
    Use a whole number of bars from 1 to 99.
    {% endif %}

cost_bps:
  type: str
  help: Transaction cost per unit of one-way turnover, in basis points
  default: "5"
  validator: >-
    {% if not (cost_bps | regex_search('^[0-9]+(\\.[0-9]+)?$')) %}
    Use a non-negative number of basis points, such as 5 or 2.5.
    {% endif %}

quant_agent_os_source:
  type: str
  help: Where to install quant-agent-os from (agent-tools only), a git+https URL or a local path
  default: git+https://github.com/yuxuzi/quant-agent-os
  when: "{{ 'agent-tools' in components }}"
  validator: >-
    {% if '"' in quant_agent_os_source or '\\' in quant_agent_os_source or not quant_agent_os_source.strip() %}
    Use a git+https URL or a path written with forward slashes.
    {% endif %}

# Set by pytemplate from the profile defaults plus requested components (passed as data).
components:
  type: str
  help: Components to include
  multiselect: true
  choices:
    - agent-tools
    - data-csv
    - data-parquet
    - metrics
  default: []
