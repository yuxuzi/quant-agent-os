contract = 1
id = "backtest"
name = "Backtest"
description = "A daily vectorised backtest of signal-driven weights with lagged trades, costs, and walk-forward splits, with bias tests."
version = "1"
kind = "cli"
status = "experimental"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
default_components = ["metrics", "data-csv"]
optional_components = ["data-parquet", "data-database", "agent-tools"]
dependencies = ["numpy>=1.26"]
questions = ["description", "author", "email", "python_version", "license", "frequency", "cost_bps"]
security_posture = "Reads local price files only; no orders, broker connectivity, network access, or credentials."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
