contract = 1
id = "report"
name = "Research report"
description = "Markdown reports from alpha-research or backtest results that keep computed figures apart from interpretation."
version = "1"
kind = "cli"
status = "experimental"
supported_python = ["3.11", "3.12", "3.13", "3.14", "3.15"]
lifecycle_commands = ["uv sync", "uv run ruff check .", "uv run ruff format --check .", "uv run mypy {package} tests", "uv run pytest"]
default_components = ["metrics"]
optional_components = ["agent-tools"]
dependencies = ["numpy>=1.26"]
questions = ["description", "author", "email", "python_version", "license"]
security_posture = "Reads local result files only; no network access, credentials, or trading."

[dependency_groups]
dev = ["mypy>=1.11", "pytest>=8.0", "ruff>=0.6"]
