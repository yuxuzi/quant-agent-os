name: Upgrade drill

# Upgrades from a real tagged release and rolls back, on both stores (docs/operations.md). It builds two
# images per store, so it runs when something it proves could change, not on every pull request.
on:
  pull_request:
    paths:
      - ".github/workflows/upgrade-drill.yml"
      - ".dockerignore"
      - "deploy/**"
      - "src/quant_agent_os/runs/**"
      - "src/quant_research/infrastructure/*_store.py"
      - "src/quant_research/infrastructure/store_common.py"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        store: [sqlite, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: deploy/upgrade-test.sh ${{ matrix.store }}
