name: Release

# A v* tag builds and checks the wheel and sdist and creates a GitHub release with them.
# Publishing to PyPI is opt-in: it runs only when the repository variable PUBLISH_TO_PYPI is
# "true". It uses PyPI Trusted Publishing, so no API token is stored in the repository.
# One-time setup for PyPI: add a trusted publisher for this repository with workflow
# "release.yml" and environment "pypi" for quant-agent-os, and create the "pypi" environment in
# GitHub. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      - name: Check that the tag matches the project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - name: Check that the plugin and changelog name that version
        run: uv run pytest tests/contract/test_release.py
      - run: uv run pytest
      - run: uv build
      - name: Check that the one wheel was built
        run: test "$(ls dist/*.whl | wc -l)" -eq 1
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          # Relative links point into the repository at this tag.
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          sed -i -E "s#\]\(((docs|deploy|skills|clients|packages|apps)/[^)]*|[A-Z]+\.md)\)#](${base}/\1)#g" notes.md
      - name: Create the release with the built wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quant-agent-os/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv publish --trusted-publishing always dist/*
