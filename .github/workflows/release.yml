name: Release

# Publishing uses PyPI Trusted Publishing; no API token is stored in the repository.
# One-time setup: on PyPI, add a trusted publisher for this repository with workflow
# "release.yml" and environment "pypi" for each of the five packages (quant-agent-os,
# quant-agent-os-research, quant-agent-os-analytics, quant-agent-os-factory, and
# quant-agent-os-platform), and create the "pypi" environment in GitHub. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Check that the tag matches the project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - name: Check that every package has that version and pins its siblings to it
        run: uv run pytest tests/contract/test_release.py
      - run: uv run pytest
      - run: uv build --all-packages
      - name: Check that all five packages were built
        run: test "$(ls dist/*.whl | wc -l)" -eq 5
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quant-agent-os-platform/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv publish --trusted-publishing always dist/*
