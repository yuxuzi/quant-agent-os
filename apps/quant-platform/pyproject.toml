[project]
name = "quant-agent-os-platform"
version = "0.1.1"
description = "Quant-Agent-OS platform server: every product's tools, resources, and prompts behind one MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "quant-agent-os[api,mcp]==0.1.1",
    "quant-agent-os-analytics==0.1.1",
    "quant-agent-os-research==0.1.1",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# The App Factory toolset (decision 0012): optional, so a team image need not carry
# pytemplate-uv.
factory = [
    "quant-agent-os-factory==0.1.1",
]
# Pass-throughs to Quant Research, for the team image.
pdf = [
    "quant-agent-os-research[pdf]==0.1.1",
]
postgres = [
    "quant-agent-os-research[postgres]==0.1.1",
]

[project.scripts]
quant-platform = "quant_platform.cli:main"

[tool.uv.sources]
quant-agent-os = { workspace = true }
quant-agent-os-analytics = { workspace = true }
quant-agent-os-factory = { workspace = true }
quant-agent-os-research = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quant_platform"
