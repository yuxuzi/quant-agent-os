[project]
name = "quant-agent-os"
version = "0.3.0"
description = "Quantitative research tools with cited, computed evidence, served to AI clients over MCP: cited keyword search with entity linking over your own corpus, performance and risk metrics by dataset reference, and application generation"
readme = "README.md"
requires-python = ">=3.11"
license = "BUSL-1.1 AND MIT"
license-files = ["LICENSE", "src/quant_app_factory/packs/LICENSE"]
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
keywords = ["quant", "agents", "llm", "mcp", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "typer>=0.12",
]

# One wheel holds the five import names (decision 0018); each extra brings a product's dependencies.
[project.scripts]
qaos = "quant_platform.cli:main"

[project.optional-dependencies]
# opentelemetry-api: spans and metrics per call (decision 0015, Q-17); a no-op without an SDK.
mcp = [
    "mcp>=1.20,<2",
    "opentelemetry-api>=1.30,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "opentelemetry-api>=1.30,<2",
]
# The MCP and REST server, over stdio and HTTP.
server = ["quant-agent-os[api,mcp]"]
pdf = ["pypdf>=6.20,<7"]
# Parquet files for `qaos data add`, converted when added; serving needs neither package.
parquet = ["pandas>=3,<4", "pyarrow>=26,<27"]
# PostgreSQL knowledge store (B-14); the binary build bundles libpq.
postgres = ["psycopg[binary]>=3.2,<4"]
# Embeddings on this machine (fastembed, ONNX). Not in `all`: no onnxruntime wheel for Python 3.15.
local-embeddings = ["fastembed>=0.9,<0.10"]
# The metric formulas (decision 0010): empyrical, not pyfolio, which adds only plotting.
analytics = ["empyrical-reloaded>=0.7,<0.8"]
# The App Factory (decision 0006). Optional, so a team image need not carry pytemplate-uv.
factory = ["pytemplate-uv>=3.0,<4"]
all = ["quant-agent-os[analytics,factory,parquet,pdf,postgres,server]"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "quant-agent-os[all]",
]

[tool.uv]
# Supply-chain cool-off: dependencies added by this project (and their new transitive
# dependencies) lock only releases at least two weeks old. Move the date forward deliberately
# when upgrading. Quant Analytics' empyrical-reloaded stack (B-13) and the api extra's
# fastapi and opentelemetry-api (B-18), and psycopg (B-14) use 2026-10-18; pyarrow uses 2026-10-22.
# pytemplate-uv is exempt: it is first-party (same author), and the App Factory
# needs its 3.0 API.
exclude-newer-package = { pypdf = "2026-10-16T00:00:00Z", mcp = "2026-10-16T00:00:00Z", starlette = "2026-10-16T00:00:00Z", sse-starlette = "2026-10-16T00:00:00Z", certifi = "2026-10-16T00:00:00Z", pycparser = "2026-10-16T00:00:00Z", copier = "2026-10-16T00:00:00Z", dunamai = "2026-10-16T00:00:00Z", funcy = "2026-10-16T00:00:00Z", jinja2 = "2026-10-16T00:00:00Z", jinja2-ansible-filters = "2026-10-16T00:00:00Z", markupsafe = "2026-10-16T00:00:00Z", platformdirs = "2026-10-16T00:00:00Z", plumbum = "2026-10-16T00:00:00Z", prompt-toolkit = "2026-10-16T00:00:00Z", pyyaml = "2026-10-16T00:00:00Z", questionary = "2026-10-16T00:00:00Z", wcwidth = "2026-10-16T00:00:00Z", empyrical-reloaded = "2026-10-18T00:00:00Z", numpy = "2026-10-18T00:00:00Z", pandas = "2026-10-18T00:00:00Z", scipy = "2026-10-18T00:00:00Z", bottleneck = "2026-10-18T00:00:00Z", peewee = "2026-10-18T00:00:00Z", pytz = "2026-10-18T00:00:00Z", python-dateutil = "2026-10-18T00:00:00Z", six = "2026-10-18T00:00:00Z", tzdata = "2026-10-18T00:00:00Z", fastapi = "2026-10-18T00:00:00Z", opentelemetry-api = "2026-10-18T00:00:00Z", psycopg = "2026-10-18T00:00:00Z", psycopg-binary = "2026-10-18T00:00:00Z", pyarrow = "2026-10-22T00:00:00Z" }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "quant_agent_os",
    "quant_analytics",
    "quant_app_factory",
    "quant_platform",
    "quant_research",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "quant_agent_os",
    "quant_analytics",
    "quant_research",
    "quant_app_factory",
    "quant_platform",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "examples"]
# Template packs hold code for generated projects, which type-check it themselves.
exclude = ["src/quant_app_factory/packs/"]

[[tool.mypy.overrides]]
module = ["empyrical", "empyrical.*"]  # untyped; quant_analytics.metrics types its boundary
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pyarrow", "pyarrow.*"]  # untyped; read in one function of quant_agent_os.data
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples/firm-tools", "examples/portfolio-intelligence", "examples/portfolio-research", "scripts"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # starlette 1.8's TestClient prefers httpx2; httpx (already locked via mcp) still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
addopts = "-ra --cov=quant_agent_os --cov=quant_analytics --cov=quant_research --cov=quant_app_factory --cov=quant_platform --cov-report=term-missing"

[tool.coverage.run]
branch = true
