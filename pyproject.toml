[project]
name = "quant-agent-os"
version = "0.1.0"
description = "Quant-Agent-OS core: typed tools, a bounded orchestrator, and evidence-linked reports for quantitative research and application engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
keywords = ["quant", "agents", "llm", "mcp", "orchestration", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
quant-agent-os = "quant_agent_os.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "quant-agent-os-factory",
    "quant-agent-os-research",
]

[tool.uv.workspace]
# Core stays at the root; each product is a member with its own version (decision 0003).
members = ["packages/*"]

[tool.uv.sources]
quant-agent-os-factory = { workspace = true }
quant-agent-os-research = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["quant_agent_os", "quant_research", "quant_app_factory"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "examples", "packages/quant-research/src", "packages/quant-app-factory/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/quant-research/tests", "packages/quant-app-factory/tests"]
pythonpath = ["examples/portfolio-research"]
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]
addopts = "-ra --cov=quant_agent_os --cov=quant_research --cov=quant_app_factory --cov-report=term-missing"

[tool.coverage.run]
branch = true
