[project]
name = "quant-agent-os"
version = "0.1.0"
description = "Quant-Agent-OS core: typed tools, a bounded orchestrator, and evidence-linked reports for quantitative research and application engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leo Liu", email = "yuxuzi@gmail.com" }]
keywords = ["quant", "agents", "llm", "mcp", "orchestration", "research"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
quant-agent-os = "quant_agent_os.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.20,<2",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "quant-agent-os-analytics",
    "quant-agent-os-factory",
    "quant-agent-os-research[pdf]",
    "quant-agent-os[api,mcp]",
]

[tool.uv]
# Supply-chain cool-off: dependencies added by this project (and their new transitive
# dependencies) lock only releases at least two weeks old. Move the date forward deliberately
# when upgrading. Quant Analytics' empyrical-reloaded stack (B-13) and the api extra's
# fastapi and opentelemetry-api (B-18) use 2026-10-18.
# pytemplate-uv is exempt: it is first-party (same author), and the App Factory
# needs its 3.0 API.
exclude-newer-package = { pypdf = "2026-10-16T00:00:00Z", mcp = "2026-10-16T00:00:00Z", starlette = "2026-10-16T00:00:00Z", sse-starlette = "2026-10-16T00:00:00Z", certifi = "2026-10-16T00:00:00Z", pycparser = "2026-10-16T00:00:00Z", copier = "2026-10-16T00:00:00Z", dunamai = "2026-10-16T00:00:00Z", funcy = "2026-10-16T00:00:00Z", jinja2 = "2026-10-16T00:00:00Z", jinja2-ansible-filters = "2026-10-16T00:00:00Z", markupsafe = "2026-10-16T00:00:00Z", platformdirs = "2026-10-16T00:00:00Z", plumbum = "2026-10-16T00:00:00Z", prompt-toolkit = "2026-10-16T00:00:00Z", pyyaml = "2026-10-16T00:00:00Z", questionary = "2026-10-16T00:00:00Z", wcwidth = "2026-10-16T00:00:00Z", empyrical-reloaded = "2026-10-18T00:00:00Z", numpy = "2026-10-18T00:00:00Z", pandas = "2026-10-18T00:00:00Z", scipy = "2026-10-18T00:00:00Z", bottleneck = "2026-10-18T00:00:00Z", peewee = "2026-10-18T00:00:00Z", pytz = "2026-10-18T00:00:00Z", python-dateutil = "2026-10-18T00:00:00Z", six = "2026-10-18T00:00:00Z", tzdata = "2026-10-18T00:00:00Z", fastapi = "2026-10-18T00:00:00Z", opentelemetry-api = "2026-10-18T00:00:00Z" }

[tool.uv.workspace]
# Core stays at the root; each product is a member with its own version (decision 0003).
members = ["packages/*"]

[tool.uv.sources]
quant-agent-os = { workspace = true }
quant-agent-os-analytics = { workspace = true }
quant-agent-os-factory = { workspace = true }
quant-agent-os-research = { workspace = true }

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["quant_agent_os", "quant_analytics", "quant_research", "quant_app_factory"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "src",
    "examples",
    "packages/quant-analytics/src",
    "packages/quant-research/src",
    "packages/quant-app-factory/src",
]
# Template packs hold code for generated projects, which type-check it themselves.
exclude = ["packages/quant-app-factory/src/quant_app_factory/packs/"]

[[tool.mypy.overrides]]
module = ["empyrical", "empyrical.*"]  # untyped; quant_analytics.metrics types its boundary
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/quant-analytics/tests",
    "packages/quant-research/tests",
    "packages/quant-app-factory/tests",
]
pythonpath = ["examples/portfolio-research"]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    # starlette 1.8's TestClient prefers httpx2; httpx (already locked via mcp) still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
addopts = "-ra --cov=quant_agent_os --cov=quant_analytics --cov=quant_research --cov=quant_app_factory --cov-report=term-missing"

[tool.coverage.run]
branch = true
